<section class="card">
  <h1>Your accounts</h1>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Account</th><th>ID</th><th>Balance</th></tr></thead>
      <tbody>{{accounts}}</tbody>
    </table>
  </div>
</section>
<section class="card">
  <h2>Recent transactions</h2>
  <div class="table-wrap">
    <table>
      <thead><tr><th>ID</th><th>Date</th><th>Description</th><th>Amount</th><th>Memo</th></tr></thead>
      <tbody>{{transactions}}</tbody>
    </table>
  </div>
</section>
