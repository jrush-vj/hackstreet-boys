# SQL injection pack (group: SQL). sqli-0xx = known patterns -> DENY.
# sqli-1xx = unknown-looking SQL metacharacter + keyword -> DIVERT (sandbox + honeypot study it; the learner
# may write a specific L-rule). DENY always wins over DIVERT in the same engine pass.
- id: sqli-001
  owasp: A05
  match_type: regex
  target: any
  pattern: (?i)(?:'|%27)\s*(?:or|and)\s+(?:(?:'|%27)?\d+(?:'|%27)?\s*=\s*(?:'|%27)?\d+(?:'|%27)?|\d+\s*=\s*\d+)
  action: DIVERT
  description: SQL tautology on a number (1=1)
- id: sqli-002
  owasp: A05
  match_type: regex
  target: any
  pattern: (?i)\bunion(?:%20|\+|\s)+select\b
  action: DIVERT
  description: UNION-based query
- id: sqli-003
  owasp: A05
  match_type: regex
  target: any
  pattern: (?i)(?:--|%23|#)\s*$
  action: DIVERT
  description: SQL comment marker at the end of the input
- id: sqli-004
  owasp: A05
  match_type: regex
  target: any
  pattern: (?i)(?:;|%3b)(?:%20|\+|\s)*(?:select|insert|update|delete|drop)\b
  action: DIVERT
  description: Stacked SQL statement
- id: sqli-005
  owasp: A05
  match_type: regex
  target: any
  pattern: (?i)\b(?:sleep|benchmark|extractvalue|updatexml)\s*\(
  action: DIVERT
  description: Time- or error-based SQL function
- id: sqli-006
  owasp: A05
  match_type: regex
  target: any
  pattern: (?i)\bunion\b(?:\s|%20|\+|/\*.*?\*/)+(?:all\s+)?select\b
  action: DIVERT
  description: UNION with comment or ALL obfuscation
- id: sqli-007
  owasp: A05
  match_type: regex
  target: any
  pattern: (?i)\b(?:information_schema|sqlite_master|pg_catalog|mysql\.user)\b
  action: DIVERT
  description: Schema enumeration
- id: sqli-008
  owasp: A05
  match_type: regex
  target: any
  pattern: (?i)(?:;|%3b)\s*(?:shutdown|exec|xp_cmdshell|waitfor)\b
  action: DIVERT
  description: Stacked dangerous statement
- id: sqli-009
  owasp: A05
  match_type: regex
  target: any
  pattern: (?i)/\*!\d*|\*/\s*(?:or|and|union|select)\b
  action: DIVERT
  description: MySQL inline comment obfuscation
- id: sqli-010
  owasp: A05
  match_type: regex
  target: any
  pattern: (?i)\b(?:load_file|into\s+(?:out|dump)file)\b
  action: DIVERT
  description: File read/write via SQL
- id: sqli-011
  owasp: A05
  match_type: regex
  target: any
  pattern: (?i)\bwaitfor\s+delay\b
  action: DIVERT
  description: Time-based SQL Server injection
- id: sqli-012
  owasp: A05
  match_type: regex
  target: any
  pattern: (?i)'\s*(?:or|and)\s+'?\w+'?\s*(?:=|like)\s*'?\w+
  action: DIVERT
  description: Quoted tautology on a string ('a'='a')
- id: sqli-100
  owasp: A05
  match_type: regex
  target: any
  pattern: (?i)(?:'|%27|\"|%22|`|;|%3b|--|%2d%2d|/\*)[\s%20+]*(?:select|union|or|and|insert|update|delete|drop|exec|from|where|having|order\s+by|group\s+by|null|cast|declare)\b|\b(?:select|union|insert|update|delete|drop|exec|from|where|having)\b[^a-z0-9]{0,6}(?:'|%27|\"|%22|;|%3b|--)
  action: DIVERT
  description: 'Unknown SQL-looking input: quote or comment next to a SQL keyword'
